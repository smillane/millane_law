<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact - Millane Law</title>
    <meta name="description" content="Contact Millane Law to schedule an appointment.">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/components.js" defer></script>
</head>
<body>
    <site-header></site-header>

    <main id="main-content">
        <section class="banner">
            <h1>Contact Us</h1>
            <p>Schedule An Appointment</p>
        </section>

        <section class="container">
            <section class="box contact-panel">
                <form class="contact-form" name="contact" method="POST" action="/thank-you.html"
                    data-netlify="true" netlify-honeypot="bot-field">
                    <input type="hidden" name="form-name" value="contact" />
                    <p hidden>
                        <label>Leave this field empty: <input name="bot-field" /></label>
                    </p>
                    <p>Name, email, and a brief message are required.</p>
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" autocomplete="name" required />
                    </div>
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" autocomplete="email" required />
                    </div>
                    <div class="form-row">
                        <label for="phone">Phone <span class="optional">(optional)</span></label>
                        <input type="tel" name="phone" id="phone" autocomplete="tel" />
                    </div>
                    <div class="form-row">
                        <label for="subject">Subject <span class="optional">(optional)</span></label>
                        <input type="text" name="subject" id="subject" />
                    </div>
                    <div class="form-row">
                        <label for="message">Brief description of your legal issue</label>
                        <p class="form-note" id="message-help">Please do not include confidential information.
                            Contacting Millane Law does not create an attorney-client relationship.
                            <a href="disclaimer.html">Read the disclaimer</a>.</p>
                        <textarea name="message" id="message" aria-describedby="message-help" rows="5" required></textarea>
                    </div>
                    <div class="form-row">
                        <button type="submit" class="button primary">Send Message</button>
                    </div>
                </form>
            </section>
        </section>
    </main>

    <site-footer></site-footer>
</body>
</html>
