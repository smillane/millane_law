<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact - Millane Law</title>
    <meta name="description" content="Contact Millane Law to schedule an appointment.">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/components.js" defer></script>
    <style>
        .form-row { margin-bottom: 1rem; }
        .form-row input, .form-row textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }
        .form-row input[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .form-row input[type="submit"]:hover {
            background-color: #2a3a4a;
        }
    </style>
</head>
<body>
    <site-header></site-header>

    <main>
        <section class="banner" style="padding: 2rem 1rem;">
            <h2>Contact Us</h2>
            <p>Schedule An Appointment</p>
        </section>

        <section class="container">
            <section class="box" style="max-width: 600px; margin: 0 auto; text-align: left;">
                <form action="post" data-netlify="true">
                    <div class="form-row">
                        <input type="text" name="name" id="name" required placeholder="Name" />
                    </div>
                    <div class="form-row">
                        <input type="email" name="email" id="email" required placeholder="Email" />
                    </div>
                    <div class="form-row">
                        <input type="text" name="phone" id="phone" placeholder="Phone" />
                    </div>
                    <div class="form-row">
                        <input type="text" name="subject" id="subject" placeholder="Subject" />
                    </div>
                    <div class="form-row">
                        <textarea name="message" id="message" placeholder="Brief Description of Your Legal Issue" rows="6" required></textarea>
                    </div>
                    <div class="form-row">
                        <div data-netlify-recaptcha="true"></div>
                    </div>
                    <div class="form-row" style="text-align: center;">
                        <input type="submit" value="Send Message" class="button primary" />
                    </div>
                </form>
            </section>
        </section>
    </main>

    <site-footer></site-footer>
</body>
</html>
